name: Collect exact Deckart model photos
on:
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pillow
      - run: python scripts/collect_deckart_models.py
      - uses: actions/upload-artifact@v4
        with:
          name: deckart-model-photos
          path: deckart-model-photos.zip
          retention-days: 30
