name: Deploy Astro to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit SEO pages
        run: python3 scripts/seo_audit.py
      - name: Upload SEO audit report
        uses: actions/upload-artifact@v4
        with:
          name: nimtech-seo-audit
          path: seo-audit-report.md
          retention-days: 30
      - uses: withastro/action@v3
        with:
          path: .
          node-version: '22'
          package-manager: npm
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
